name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libfftw3-dev

      - name: Build (FFTW)
        run: make guinea FFTW_HOME=/usr

      - name: Build (no FFTW, legacy)
        run: make guinea_nofftw

      - name: Prepare test parameters
        run: cat test_params.dat >> acc.dat

      - name: Run luminosity smoke test
        run: ./guinea muon ci_test ci_test.out

      - name: Run 10 TeV muon pair-production test
        run: ./guinea muon muon_pairs_10tev muon_pairs_10tev.out

      # Regression test for the bug this parameter set exists to avoid: pair
      # tracking used to die in step_pair_1() (undersized ph[] buffer) and the
      # workaround was track_pairs=0, which silently produced production-time
      # pairs with ~23x too little pT. If pairs.dat is absent or empty, tracking
      # did not run and any HepMC built from this would be unusable.
      - name: Assert tracked pairs were produced
        run: |
          if [ ! -s pairs.dat ]; then
            echo "pairs.dat missing or empty -- pair tracking did not run" >&2
            exit 1
          fi
          echo "pairs.dat: $(wc -l < pairs.dat) tracked pair leptons"
          python3 - <<'EOF'
          # the whole point is that tracked pairs are harder than produced ones
          def mean_pt(path):
              tot = n = 0
              for line in open(path):
                  f = line.split()
                  if len(f) < 4:
                      continue
                  e = abs(float(f[0]))
                  tot += e * (float(f[1])**2 + float(f[2])**2) ** 0.5
                  n += 1
              return tot / n
          trk, prod = mean_pt("pairs.dat"), mean_pt("pairs0.dat")
          print(f"mean pT: produced {prod*1e3:.3f} MeV -> tracked {trk*1e3:.3f} MeV "
                f"(x{trk/prod:.1f})")
          assert trk > 5 * prod, f"tracked pT only x{trk/prod:.2f} above produced"
          EOF

  docker:
    name: Build and publish Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
